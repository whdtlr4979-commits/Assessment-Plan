<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교수학습 및 평가 운영 계획 작성기</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">교수학습·평가 계획 작성기</div>
    <div class="tools">
      <button type="button" data-act="newPlan">새로 만들기</button>
      <button type="button" data-act="loadExample">예시 불러오기</button>
      <span class="sep"></span>
      <button type="button" data-act="saveFile" title="작성 중인 내용을 파일로 저장합니다. 동료 교사와 공유하거나 나중에 이어서 작성할 때 사용하세요.">파일로 저장</button>
      <label class="as-button" title="[파일로 저장]한 .json 파일을 불러옵니다">파일 열기<input type="file" id="planFile" accept=".json" hidden></label>
      <span class="sep"></span>
      <button type="button" class="primary" data-act="exportHwpx" title="양식과 같은 스타일의 한글 문서(.hwpx)로 내려받습니다">한글(.hwpx) 다운로드</button>
      <button type="button" data-act="print">인쇄 / PDF</button>
    </div>
    <div id="status" class="status"></div>
  </header>

  <main id="doc" class="doc"></main>

  <dialog id="picker">
    <h2>성취기준 선택</h2>
    <div id="pickerType" class="picker-type">
      평가 유형 표시:
      <select id="pickerTypeSel">
        <option value="">(표시 안 함)</option>
        <option>1차 정기시험</option>
        <option>2차 정기시험</option>
        <option>수행평가</option>
      </select>
    </div>
    <div id="pickerBody" class="picker-body"></div>
    <div class="picker-actions">
      <button type="button" id="pickerCancel">취소</button>
      <button type="button" id="pickerApply" class="primary">적용</button>
    </div>
  </dialog>

  <script src="js/defaults.js"></script>
  <script src="js/example.js"></script>
  <script src="data/standards/index.js"></script>
  <script src="js/hwpx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
