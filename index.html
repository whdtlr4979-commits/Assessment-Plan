<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교수학습 및 평가 운영 계획 작성기</title>
  <link rel="icon" href="data:,">
  <!-- 파일을 고치면 아래 버전(v=)을 올려 주세요: 브라우저가 예전 파일을 쓰지 않도록 함 -->
  <script>window.APP_VERSION = '20261001a';</script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261001a">
</head>
<body>
  <header class="topbar">
    <div class="brand">교수학습·평가 계획</div>
    <span id="status" class="status"></span>
    <nav class="top-actions">
      <button type="button" class="btn btn-text" data-act="newPlan">새로 만들기</button>
      <button type="button" class="btn btn-text" data-act="loadExample">예시 보기</button>
      <label class="btn btn-text" title="저장해 둔 작성 파일(.json)을 불러옵니다">파일 열기<input type="file" id="planFile" accept=".json" hidden></label>
      <button type="button" class="btn btn-text" data-act="saveFile" title="작성 중인 내용을 파일로 저장합니다. 동료와 공유하거나 다른 컴퓨터에서 이어서 작성할 때 쓰세요.">파일로 저장</button>
      <button type="button" class="btn btn-primary small" data-act="exportHwpx">한글 파일 내려받기</button>
    </nav>
  </header>

  <div class="layout">
    <nav id="stepNav" class="sidebar" aria-label="작성 단계"></nav>
    <main class="content">
      <div id="stepPanel"></div>
      <div id="doc" class="doc" hidden></div>
      <div id="stepFoot" class="step-foot"></div>
    </main>
  </div>

  <dialog id="picker" class="sheet-dialog">
    <header class="dialog-head">
      <h2 id="pickerTitle">성취기준 선택</h2>
      <p id="pickerHint" class="muted"></p>
    </header>
    <div id="pickerBody" class="dialog-body"></div>
    <footer class="dialog-foot">
      <button type="button" id="pickerCancel" class="btn btn-secondary">취소</button>
      <button type="button" id="pickerApply" class="btn btn-primary">적용</button>
    </footer>
  </dialog>

  <script src="js/defaults.js?v=20261001a"></script>
  <script src="js/example.js?v=20261001a"></script>
  <script src="data/standards/index.js?v=20261001a"></script>
  <script src="js/hwpx.js?v=20261001a"></script>
  <script src="js/ai.js?v=20261001a"></script>
  <script src="js/steps.js?v=20261001a"></script>
  <script src="js/app.js?v=20261001a"></script>
</body>
</html>
